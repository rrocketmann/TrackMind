# PPO on the PolyTrack 0.5.2 simulation that ships in schoolagy.
# The car is the game's own Ammo worker. It is not the official 0.6 client.

game:
  root: /home/martinmalyshau/dev/schoolagy/polytrack
  track: tracks/official/summer1.track
  parts: null            # default is polytrack_agent/sim/cache/track_parts.json

keys: [w, a, s, d]

rl:
  action_repeat: 50      # physics frames per decision. The worker steps at 1 ms.
  stuck_s: 8
  timeout_s: 90
  epochs: 4
  minibatch_size: 256
  clip: 0.2
  gamma: 0.99
  lam: 0.95
  value_coef: 0.5
  entropy_coef: 0.01
  unimix: 0.01
  group_size: 4          # laps collected before one PPO update
  hidden: 128
  lr: 0.0003
  resume: true
  device: auto
  out_dir: runs/summer1

play:
  checkpoint: runs/summer1/best.pt
  device: auto

reward:
  progress_scale: 1.0
  time_penalty: 0.002
  finish_bonus: 1.0

# Discrete SAC on the PolyTrack 0.6.3 fork build at polytrack-0.6.3.
# POLYTRACK_ROOT is that directory. The car is polytrack_physics.wasm.
# The policy reads numbers only: position, velocity, acceleration, distance to
# the side of the road, and where the next gate is.

game:
  root: null             # overridden by POLYTRACK_ROOT or a --config overlay
  track: tracks/official/summer1.track
  parts: null            # default is polytrack_agent/sim/cache/track_parts.json

keys: [w, a, s, d]

rl:
  algo: sac              # discrete soft actor-critic. ppo remains available.
  seed: 0                # fixes Python, NumPy, and torch. null leaves them unseeded.
  sac:
    tau: 0.005
    batch_size: 256
    buffer_size: 100000
    learning_starts: 1000
    updates_per_step: 1
    init_alpha: 0.2
    # target_entropy: null  # default is 0.98 * log(n_actions), just under uniform
  action_repeat: 50      # physics frames per decision. The worker steps at 1 ms.
                         # Keep at 50: measured better than 10 for learning
                         # (see TROUBLESHOOTING, "the learner does not find the
                         # good action").
  stuck_s: 8
  timeout_s: 90
  reset_action: false    # add a 10th action that holds reset (respawn at checkpoint)
  auto_respawn: false    # on stuck, respawn at the last checkpoint instead of ending
  airborne_grace_s: 0.5  # wheels may leave the ground this long before it counts as beached
  epochs: 4
  minibatch_size: 256
  clip: 0.2
  gamma: 0.99
  lam: 0.95
  value_coef: 0.5
  entropy_coef: 0.01
  unimix: 0.01
  group_size: 4          # laps collected before one PPO update
  hidden: 128
  lr: 0.0003
  resume: true
  device: auto
  out_dir: runs/sac
  # stop_time: 25       # stop training once a lap finishes at or below this many seconds

play:
  checkpoint: runs/sac/best.pt
  device: auto

reward:
  progress_scale: 1.0
  time_penalty: 0.002
  finish_bonus: 1.0
  respawn_penalty: 0.0    # subtracted each time the car respawns at a checkpoint
  contact_reward: 0.0     # paid each step per wheel on the track surface, scaled by ground covered
  beach_penalty: 0.0      # charged once when every wheel leaves the ground and the car stalls
  stall_penalty: 0.0      # charged each step the car sits on the road without covering ground
  speed_reward: 0.0       # paid each step for ground speed while the wheels are down
  speed_cap_kmh: 120      # above this the speed reward stops growing

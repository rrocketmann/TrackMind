# Specialist PPO on one PolyTrack 0.6.3 track.
# POLYTRACK_ROOT is the fork directory. The car is polytrack_physics.wasm.
# The policy reads velocity, heading, the road edge, and the next gate.
# Training copies the fastest laps of the most common track in TrackData
# before PPO, and keeps a clone loss for the first updates. The reward follows
# that track's best lap until a car finishes it or covers most of it, then
# the reward is lap time. TRACKDATA overrides rl.bc.root.
# runs/winter4 is the saved on-track run. This file starts a new directory.

game:
  root: null             # overridden by POLYTRACK_ROOT or a --config overlay
  track: tracks/official/winter4.track
  parts: null            # default is polytrack_agent/sim/cache/track_parts.json

keys: [w, a, s, d]

rl:
  algo: ppo              # actor plus a critic for the environment reward. sac remains available.
  seed: 0                # fixes Python, NumPy, and torch. null leaves them unseeded.
  sac:
    tau: 0.005
    batch_size: 256
    buffer_size: 100000
    learning_starts: 1000
    updates_per_step: 1
    init_alpha: 0.2
    alpha_lr: 0.00001      # SGD. Adam on this knob walks alpha to its clamp.
    # target_entropy: null  # default is 0.6 * log(n_actions), low enough to hold one button
  action_repeat: 50      # physics frames per decision. The worker steps at 1 ms.
                         # Keep at 50: measured better than 10 for learning
                         # (see TROUBLESHOOTING, "the learner does not find the
                         # good action").
  stuck_s: 8
  timeout_s: 90
  reset_action: false    # add a 10th action that holds reset (respawn at checkpoint)
  auto_respawn: false    # on stuck, respawn at the last checkpoint instead of ending
  airborne_grace_s: 0.5  # wheels may leave the ground this long before it counts as beached
  epochs: 4
  minibatch_size: 256
  clip: 0.2
  gamma: 0.998            # per decision. At 50 ms that is about a 25 s horizon.
  lam: 0.95
  value_coef: 0.5
  entropy_coef: 0         # sharpness is the schedule below, not a bonus inside PPO
  entropy:
    bump: 0.5             # one lift, applied on the first update of a run
    drop: 0               # the target stays put
    wobble: 0.04          # PPO may leave entropy this far from the target
    floor: 0.08
  unimix: 0.01
  group_size: 4          # laps collected before one PPO update
  workers: null          # null: one physics process per performance core, each pinned to its own core
  hidden: 128
  lr: 0.0003
  resume: true
  device: auto
  out_dir: runs/winter4-follow
  # stop_time: 20.46    # otherwise the best cloned lap time
  bc:
    enabled: true
    root: null           # TRACKDATA, else ~/dev/trackdata
    margin_s: 0.5        # keep laps at or under the fastest time plus this
    epochs: 25           # longer clone before PPO, so the actor starts on the lap
    batch_size: 256
    lr: 0.001
    coef: 0.25           # clone loss mixed into the first PPO updates
    updates: 150         # those updates, and only while the reward is still the reference lap

play:
  checkpoint: runs/winter4-follow/best.pt
  device: auto

reward:
  # The first stage follows the best archived lap: advance along that line,
  # and a small cost for leaving it. Both are paid only on the road. The cursor
  # only looks a short way ahead, and it still moves while the car is off the
  # road, so a jump does not score. Once a car finishes or reaches line_close,
  # the stage switches to time: a per-second cost, a finish bonus, and a bonus
  # for beating the reference lap. The chord fields below are the fallback
  # when no reference lap is loaded.
  line_scale: 4.0         # a full reference lap pays this much for staying on it
  line_lateral: 0.02      # per metre off the line, per second, on the road
  line_lateral_cap: 12.0  # metres; past this the side cost stops growing
  line_back_m: 8.0        # how far behind the cursor a step may match
  line_forward_m: 40.0    # how far ahead a step may match. This blocks lap-skips
  line_close: 0.9         # fraction of the reference lap that starts the time stage
  time_stage_penalty: 0.25  # per second, time stage only
  time_stage_bonus: 20.0    # paid on a finish in the time stage
  time_scale: 1.0           # extra per second faster than the reference lap
  time_line_scale: 1.0      # small along-track pay kept during the time stage
  progress_scale: 1.0     # forward chord progress pays this much per gate; backward costs it
  speed_reward: 0.05      # per decision at speed_cap, signed by speed toward the next gate
  speed_cap_kmh: 120      # above this the speed reward stops growing
  speed_drop_penalty: 1.0 # times the extra speed lost in one decision, as a fraction of speed_cap
  speed_drop_margin: 1500 # km/h per second that is still a normal change (about 75 km/h in 50 ms)
  time_penalty: 0.0       # per second of the decision
  finish_bonus: 0.0
  respawn_penalty: 0.0    # subtracted each time the car respawns at a checkpoint
  contact_reward: 0.0     # paid each step per wheel on the track surface, scaled by ground covered
  beach_penalty: 0.0      # charged once when every wheel leaves the ground and the car stalls
  stall_penalty: 0.0      # added each step the car sits on the road without covering ground
  fail_penalty: 0.0       # subtracted once on a fall, stall, beach, or timeout
  offtrack_penalty: 0.0   # per second while the car is past the road edge

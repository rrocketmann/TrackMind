[project]
name = "polytrack-agent"
version = "0.1.0"
description = "PPO on the PolyTrack 0.5.2 simulation in the local schoolagy checkout."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
polytrack-agent = "polytrack_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["polytrack_agent*"]

[tool.setuptools.package-data]
polytrack_agent = ["default_config.yaml", "sim/host.mjs"]
